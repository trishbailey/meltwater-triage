{% extends "_base.html" %}{% block title %}Sign in{% endblock %}{% block body %}
<div class="panel narrow"><h1>Threat and Protest Monitor</h1><p class="intro">Enter the password to continue.</p>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="next" value="{{ next }}">
<label for="password">Password</label>
<input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
<p><button class="btn primary" type="submit" style="width:100%">Sign in</button></p></form></div>
{% endblock %}
