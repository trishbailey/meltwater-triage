<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Meltwater Triage</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem}.err{color:#b00020}</style>
</head><body>
<h1>Meltwater Triage</h1>
<p>Upload one or more Meltwater exports (.xlsx or .csv). You will receive an Excel file of posts flagged for threat or protest language.</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/upload" enctype="multipart/form-data">
  <input type="file" name="files" accept=".xlsx,.csv" multiple required>
  <button type="submit">Screen posts</button>
</form>
</body></html>
